# UrbanLoco Hong Kong (ulhk 4/5/6). Velodyne HDL-32E, Xsens MTi-10 at 100 Hz.
# Topics from the UrbanLoco README. Values = upstream FAST_LIO config/velodyne.yaml,
# whose [0, 0, 0.28] matches UrbanLoco's documented 0.28 m LiDAR-IMU offset.
common:
    lid_topic: "/velodyne_points"
    imu_topic: "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0
preprocess:
    lidar_type: 2
    scan_line: 32                 # HDL-32E
    scan_rate: 10
    timestamp_unit: 2             # TO VERIFY with fl2_cloudcheck.py on the bag
    blind: 2
mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 180
    det_range: 100.0
    extrinsic_est_en: false
    extrinsic_T: [ 0, 0, 0.28]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]
publish:
    path_en: true
    scan_publish_en: false
    dense_publish_en: false
    scan_bodyframe_pub_en: false
pcd_save:
    pcd_save_en: false
    interval: -1

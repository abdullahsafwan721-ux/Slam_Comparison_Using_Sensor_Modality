# LIO-SAM dataset, park (liosam 1) and garden (liosam 2). Velodyne VLP-16.
# Source: LIO-SAM README -- park/garden run with the default settings, i.e. IMU
# /imu_raw and extrinsicRot diag(-1,1,-1) (config/params.yaml). That matrix is
# its own transpose, so it is also FAST-LIO's R_IL.
common:
    lid_topic: "/points_raw"
    imu_topic: "/imu_raw"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0
preprocess:
    lidar_type: 2                 # 1 Livox, 2 Velodyne, 3 Ouster
    scan_line: 16                 # VLP-16
    scan_rate: 10
    timestamp_unit: 0             # 0 s, 1 ms, 2 us, 3 ns -- see note below
    blind: 2
mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 180
    det_range: 100.0
    extrinsic_est_en: false
    extrinsic_T: [ 0.0, 0.0, 0.0 ]
    extrinsic_R: [ -1, 0, 0,
                    0, 1, 0,
                    0, 0, -1]
publish:
    path_en: true
    scan_publish_en: false
    dense_publish_en: false
    scan_bodyframe_pub_en: false
pcd_save:
    pcd_save_en: false
    interval: -1
# timestamp_unit: LIO-SAM's README states the per-point "time" is relative time
# in SECONDS (0..0.1 s at 10 Hz). The guide's value 2 (us) would scale it by
# 1e-3 and switch de-skew off. Verified on the bag with fl2_cloudcheck.py.

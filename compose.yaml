x-common: &common
  environment:
    - DISPLAY=${DISPLAY}
    - NVIDIA_DRIVER_CAPABILITIES=all
    - QT_X11_NO_MITSHM=1

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./data:/data:ro
    - ./config:/config:ro
    - ./scripts:/scripts:ro
    - ./output:/output

  stdin_open: true
  tty: true

  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:

  orbslam3:
    <<: *common
    build:
      context: .
      dockerfile: docker/orbslam3.Dockerfile
    image: evtol/orbslam3:v1

  # Same source with upstream's REGISTER_TIMES switched on; used only to measure tracking
  # time per frame (scripts/stage3/orbslam3_timing.sh). Accuracy runs stay on orbslam3:v1.
  orbslam3_times:
    <<: *common
    build:
      context: .
      dockerfile: docker/orbslam3_times.Dockerfile
    image: evtol/orbslam3:v1-times

  fastlio2:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlio2.Dockerfile
    image: evtol/fastlio2:v1
    shm_size: 4gb

  # Same Dockerfile, FAST_LIO at the July-2021 commit the paper was written with
  # (arXiv v1, 14 Jul 2021). Used only to check paper-vs-HEAD code differences.
  fastlio2_paper2021:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlio2.Dockerfile
      args:
        FASTLIO2_COMMIT: f159d57da8fa48920cefae1e9b289cb1785e4faa
    image: evtol/fastlio2:paper2021
    shm_size: 4gb

  fastlivo2:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlivo2.Dockerfile
    image: evtol/fastlivo2:v1
    shm_size: 4gb

  eval:
    <<: *common
    build:
      context: .
      dockerfile: docker/eval.Dockerfile
    image: evtol/eval:v1

  # ---- Stages 2-4: simulation (own network: its roscore is private).
  # Gazebo 11 + PX4 v1.14.4 SITL + MAVROS + the patched Mid-360 plugin.
  # Worlds, models and launch files are mounted from ./sim/evtol_sim at /sim
  # (generated on the host by scripts/common/gen_configs.py and gen_world.py),
  # so editing config/rig.yaml never needs an image rebuild.
  sim:
    <<: *common
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    image: evtol/sim:v1
    shm_size: 4gb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data:ro
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./output:/output
      - ./sim/evtol_sim:/sim:ro

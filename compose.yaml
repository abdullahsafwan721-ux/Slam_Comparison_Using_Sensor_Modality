x-common: &common
  environment:
    - DISPLAY=${DISPLAY}
    - NVIDIA_DRIVER_CAPABILITIES=all
    - QT_X11_NO_MITSHM=1
    # PX4's own simulation speed (its Gazebo plugin scales real_time_update_rate by it). Passed only
    # when set on the host, e.g. PX4_SIM_SPEED_FACTOR=0.25, when the GPU is busy with other work and
    # Gazebo drops camera frames at full speed (final verification, 18 Nov). Sensor data are in
    # simulation time, so the recorded data do not change. Leave it unset otherwise: PX4's rcS then
    # also rescales COM_OF_LOSS_T and other loss timeouts (to factor x 0.5 s), even for a factor of 1.
    - PX4_SIM_SPEED_FACTOR
    # RViz and rqt open a modal "ROS Noetic goes end-of-life" notice that covers the view (the guide's first
    # look, Stage 2); the end of life is known and deliberate (the project guide fixes Noetic).
    - DISABLE_ROS1_EOL_WARNINGS=1

  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./data:/data:ro
    - ./config:/config:ro
    - ./scripts:/scripts:ro
    - ./output:/output

  stdin_open: true
  tty: true

  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:

  orbslam3:
    <<: *common
    build:
      context: .
      dockerfile: docker/orbslam3.Dockerfile
    image: evtol/orbslam3:v1

  # Same source with upstream's REGISTER_TIMES switched on; used only to measure tracking
  # time per frame (scripts/stage3/orbslam3_timing.sh). Accuracy runs stay on orbslam3:v1.
  orbslam3_times:
    <<: *common
    build:
      context: .
      dockerfile: docker/orbslam3_times.Dockerfile
    image: evtol/orbslam3:v1-times

  fastlio2:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlio2.Dockerfile
    image: evtol/fastlio2:v1
    shm_size: 4gb

  # Same Dockerfile, FAST_LIO at the July-2021 commit the paper was written with
  # (arXiv v1, 14 Jul 2021). Used only to check paper-vs-HEAD code differences.
  fastlio2_paper2021:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlio2.Dockerfile
      args:
        FASTLIO2_COMMIT: f159d57da8fa48920cefae1e9b289cb1785e4faa
    image: evtol/fastlio2:paper2021
    shm_size: 4gb

  fastlivo2:
    <<: *common
    build:
      context: .
      dockerfile: docker/fastlivo2.Dockerfile
    image: evtol/fastlivo2:v1
    shm_size: 4gb

  eval:
    <<: *common
    build:
      context: .
      dockerfile: docker/eval.Dockerfile
    image: evtol/eval:v1

  # ---- Stages 2-4: simulation (own network: its roscore is private).
  # Gazebo 11 + PX4 v1.14.4 SITL + MAVROS + the patched Mid-360 plugin.
  # Worlds, models and launch files are mounted from ./sim/evtol_sim at /sim
  # (generated on the host by scripts/common/gen_configs.py and gen_world.py),
  # so editing config/rig.yaml never needs an image rebuild.
  sim:
    <<: *common
    build:
      context: .
      dockerfile: docker/sim.Dockerfile
    image: evtol/sim:v1
    shm_size: 4gb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data:ro
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./output:/output
      - ./sim/evtol_sim:/sim:ro

  # ---- Stage 5: live closed loop (guide 5.4). HOST networking so the simulator, FAST-LIO2
  # and the mission share ONE ROS master. Never run these alongside Stage 1-4 services, whose
  # roscores would be private but whose simulators would fight over the GPU and CPU.
  # Changes from the guide's listing: written out instead of merged from the sim service
  # (compose merges replace whole keys), and ROS_HOSTNAME/ROS_MASTER_URI pinned to
  # localhost so every node advertises an address the others can reach. Noetic's end-of-life is
  # known and deliberate (the guide fixes Noetic); its RViz notice is switched off.
  sim-live:
    <<: *common
    image: evtol/sim:v1
    network_mode: host
    shm_size: 4gb
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
      - DISABLE_ROS1_EOL_WARNINGS=1    # RViz's modal "Noetic end-of-life" notice covered the map
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data:ro
      - ./config:/config:ro
      - ./scripts:/scripts:ro
      - ./output:/output
      - ./sim/evtol_sim:/sim:ro

  fastlio2-live:
    <<: *common
    image: evtol/fastlio2:v1
    network_mode: host
    shm_size: 4gb
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
      - DISABLE_ROS1_EOL_WARNINGS=1    # RViz's modal "Noetic end-of-life" notice covered the map

  # Stage 5 extension: FAST-LIVO2 in the closed loop (the guide: "FAST-LIVO2 can be substituted
  # the same way"), same host networking as fastlio2-live.
  fastlivo2-live:
    <<: *common
    image: evtol/fastlivo2:v1
    network_mode: host
    shm_size: 4gb
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
      - DISABLE_ROS1_EOL_WARNINGS=1
